<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- INTERFACE role: this is the clickable prototype. Step by step, swap its fake logic for calls in src/api.ts (see docs/BOARD.md). -->
</head>
<body style="margin:0">
<title>local-ish</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column. Palette: lime + black + white (local-ish) */
:root{
  --lime:#C1F44F; --charcoal:#3A3B33;
  --bg:#EBF9CB; --surface:#FFFFFF; --surface-2:#F3FADF; --fg:#0A0A0A; --muted:#59614C; --line:#DDEBC2;
  --primary:#0A0A0A; --on-primary:#C1F44F; --saffron:#C1F44F; --saffron-bg:#EEF6D6;
  --good:#1F7A3E; --good-bg:#DDF3D0; --warn:#8A5A00; --warn-bg:#FBEBCB; --bad:#B23A27; --bad-bg:#F8DDD7;
  --c1:#0E0E0E; --c2:#7FB414; --c3:#5A6FCF; --c4:#B23A27; --c5:#D9962B; --c6:#2F9C9E; --c7:#8B9180;
  --track:#FFFFFF;
  --ink:#0A0A0A; --ink-fg:#FFFFFF; --ink-muted:#A5A5A5; --ink-line:transparent;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0B0B; --surface:#161616; --surface-2:#222222; --fg:#F4F8E8; --muted:#A3AA96; --line:#2A2A2A;
  --primary:#C1F44F; --on-primary:#0B0B0B; --saffron:#C1F44F; --saffron-bg:#1F2612;
  --good:#8EDB8A; --good-bg:#16301B; --warn:#F0B45A; --warn-bg:#33270F; --bad:#F2907C; --bad-bg:#3A1D17;
  --c1:#C1F44F; --c2:#7FB414; --c3:#93A2F2; --c4:#F2907C; --c5:#F0B45A; --c6:#6CC4C6; --c7:#8B9180; --track:#2A2A2A;
  --charcoal:#262626; --ink:#262626; --ink-line:transparent; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B0B0B; --surface:#161616; --surface-2:#222222; --fg:#F4F8E8; --muted:#A3AA96; --line:#2A2A2A;
  --primary:#C1F44F; --on-primary:#0B0B0B; --saffron:#C1F44F; --saffron-bg:#1F2612;
  --good:#8EDB8A; --good-bg:#16301B; --warn:#F0B45A; --warn-bg:#33270F; --bad:#F2907C; --bad-bg:#3A1D17;
  --c1:#C1F44F; --c2:#7FB414; --c3:#93A2F2; --c4:#F2907C; --c5:#F0B45A; --c6:#6CC4C6; --c7:#8B9180; --track:#2A2A2A;
  --charcoal:#262626; --ink:#262626; --ink-line:transparent; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);min-height:100vh;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
#app{max-width:440px;margin:0 auto;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;font-weight:800;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.approx{color:var(--muted);font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 140px;min-width:0}

/* fields */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.field input,.field select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-weight:500;width:100%}
.field input:focus,.field select:focus{border-color:var(--primary);outline:none}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.err{font-size:13px;color:var(--bad);font-weight:600}
.prefix{position:relative}
.prefix span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:600}
.prefix input{padding-left:34px}

.btn{border:0;border-radius:999px;padding:13px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-ghost{background:transparent;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.btn-block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* onboarding */
.onb-top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand i{font-style:normal;background:var(--lime);color:#0A0A0A;border-radius:9px;padding:0 8px 3px;margin-right:2px}
.progress{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:99px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.choice button[aria-pressed="true"]{background:var(--charcoal);border-color:var(--charcoal);color:#fff}
.choice button[aria-pressed="true"] span{color:#D5D7CA}
:root[data-theme="dark"] .choice button[aria-pressed="true"]{border-color:var(--lime)}
.choice strong{font-family:var(--display);font-size:17px}
.choice span{font-size:13px;color:var(--muted)}
.chip-auto{display:flex;align-items:center;gap:14px;background:var(--charcoal);color:#fff;border-radius:14px;padding:6px 16px 6px 6px;font-size:15px}
.chip-auto b{font-family:var(--display);font-size:18px}
.friends{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.friends li{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);padding:8px 8px 8px 14px;border-radius:14px;font-weight:600}
.x{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:6px 8px;border-radius:8px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0}

/* home */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.cur{display:flex;align-items:center;gap:8px;background:var(--charcoal);color:#fff;font-family:var(--display);font-weight:700;font-size:14px;padding:4px 12px 4px 4px;border-radius:12px}
.cur i{font-style:normal;width:28px;height:28px;border-radius:10px;background:var(--lime);color:#0A0A0A;display:grid;place-items:center;font-family:var(--body);font-weight:800;font-size:12px}
.hero{background:var(--primary);color:var(--on-primary);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--on-primary);opacity:.75}
.checkbox .hero{background:var(--ink);color:#fff;flex-direction:row;align-items:center;justify-content:space-between;gap:14px;padding:20px}
.checkbox .hero .eyebrow{color:#A5A5A5;opacity:1}
.badge-sq{width:46px;height:46px;border-radius:16px;background:var(--lime);color:#0A0A0A;display:grid;place-items:center;flex:none}
.badge-sq svg{width:24px;height:24px}
.hero h2{font-size:24px;line-height:1.15;max-width:15ch}
.hero p{opacity:.85}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{background:color-mix(in srgb, var(--on-primary) 12%, transparent);color:var(--on-primary);border:0;border-radius:12px;padding:12px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.modes svg{width:22px;height:22px}
.bar{height:10px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.over i{background:var(--bad)}
.big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.stats div{background:var(--surface-2);border-radius:10px;padding:10px}
.stats dt{font-size:12px;color:var(--muted);font-weight:600}
.stats dd{margin:2px 0 0;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tips li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tips .dot{width:34px;height:34px;border-radius:12px;background:var(--lime);color:#0A0A0A;display:grid;place-items:center;font-weight:800;color:var(--fg);font-size:13px}
.link{background:none;border:0;color:var(--primary);font-weight:700;padding:0}

/* onboarding: country picker. The real <select> sits on top so the phone's own list still opens */
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:0 12px}
.pick:focus-within{border-color:var(--primary)}
.pick::after{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:-4px 2px 0 0;flex:none}
.field .pick select{border:0;background:transparent;padding:11px 0;flex:1;min-width:0;outline:none;appearance:none;-webkit-appearance:none;order:1}
.pick .flag-sm{order:0}
.pick::after{order:2}
.flag-sm{width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:17px;line-height:1;flex:none}
.cur-badge{width:42px;height:42px;border-radius:15px;background:var(--lime);color:#0A0A0A;display:grid;place-items:center;font-family:var(--body);font-weight:800;font-size:17px;flex:none;overflow:hidden}
.chip-auto .flag-sm{background:var(--surface)}
/* onboarding: money converter (home currency -> trip currency) */
.fx{display:flex;flex-direction:column;gap:12px}
.fx-rate{align-self:center;display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px}
.fx-rate svg{width:18px;height:18px}
.fx-cards{position:relative;display:flex;flex-direction:column;gap:4px}
.fx-card{background:var(--ink);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:26px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.fx-card.from{padding-bottom:30px}
.fx-card.to{padding-top:30px}
.fx-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.fx-pick{position:relative;display:flex;align-items:center;gap:10px;min-width:0;max-width:60%;padding:3px 10px 3px 3px;border-radius:999px}
.fx-pick:focus-within{outline:2px solid var(--lime);outline-offset:2px}
.fx-pick .flag{width:44px;height:44px;border-radius:50%;background:#2C2C2C;display:grid;place-items:center;font-size:26px;line-height:1;flex:none}
.fx-pick b{font-family:var(--display);font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-pick svg{width:14px;height:14px;flex:none;opacity:.8}
.fx-pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.fx-amt{display:flex;align-items:baseline;justify-content:flex-end;gap:6px;flex:1;min-width:0;font-family:var(--display);font-weight:700}
.fx-sym{font-family:var(--body);font-size:26px;font-weight:700;white-space:nowrap}
.fx-amt input,.fx-amt output{background:transparent;border:0;color:inherit;font:inherit;font-size:36px;text-align:right;width:100%;min-width:0;max-width:100%;outline:none;padding:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}
.fx-amt input::-webkit-inner-spin-button,.fx-amt input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.fx-amt input:focus-visible{outline:none}
.fx-amt:focus-within{box-shadow:0 2px 0 var(--lime)}
.fx-amt output{display:block}
.fx-cards.sm .fx-amt input,.fx-cards.sm .fx-amt output{font-size:26px} /* both amounts shrink together so the two currencies always match */
.fx-sub{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink-muted)}
.fx-swap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:#fff;color:#0E0E0E;display:grid;place-items:center;box-shadow:0 0 0 4px var(--bg)}
.fx-swap svg{width:22px;height:22px}
/* onboarding extras */
.row.pair > *{flex:1 1 0}
.txt{border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface)}
.invite{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.link-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.link-row code{flex:1 1 160px;min-width:0;background:var(--surface-2);color:var(--fg);border-radius:8px;padding:10px;font-size:13px;overflow-wrap:anywhere;user-select:all}
.status{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--fg);margin-left:6px}
.status.ok{background:var(--lime);color:#0A0A0A}
.when{align-self:flex-start;font-weight:700;font-size:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}
/* money tiles */
.ess summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.ess summary::-webkit-details-marker{display:none}
.ess .more-tag{font-size:13px;font-weight:700;color:var(--primary)}
.ess[open] .more-tag{display:none}
.money{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.money.solo{grid-template-columns:1fr}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile[aria-expanded="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.tile .bar{display:block}
.tile .val{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.t-cur{font-family:var(--display);font-weight:800;font-size:16px;color:var(--muted);margin-top:2px}
.t-amt{font-family:var(--display);font-weight:800;font-size:clamp(22px,7vw,30px);line-height:1.05;font-variant-numeric:tabular-nums;margin-top:-6px;overflow-wrap:anywhere}
.t-gbp{font-size:15px;font-weight:500}
.t-panel{display:flex;flex-direction:column;gap:2px;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;margin-top:4px}
.t-panel small{font-size:12px;font-weight:500;color:var(--muted)}
.tile.group{background:var(--ink);border-color:var(--ink);color:#fff}
.tile.group .eyebrow{color:#A5A5A5}
.tile.group .t-cur,.tile.group .t-amt{color:var(--lime)}
.tile.group .t-panel{background:rgba(255,255,255,.2)}
.tile.group .t-panel small{color:#D4D4D4}
.tile.group .more{color:var(--lime)}
.tile.me .bar i{background:var(--primary)}
.tile .more{font-size:13px;font-weight:700;color:var(--primary);margin-top:auto}
/* chat-style check */
.askbar{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px;background:var(--surface)}
.askbar:focus-within{border-color:var(--primary)}
.askbar input{flex:1;min-width:0;border:0;background:transparent;padding:8px 4px;outline:none;font-weight:500}
.icon-btn{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn[hidden]{display:none}
.icon-btn.send{background:var(--primary);color:var(--on-primary)}
.icon-btn.on{background:var(--primary);color:var(--on-primary);animation:pulse 1s ease-in-out infinite}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.pills button[aria-pressed="true"]{background:var(--lime);color:#0E0E0E;border-color:var(--lime)}
.you-said{align-self:flex-end;background:var(--surface-2);padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:85%;font-weight:500;display:flex;flex-direction:column;gap:6px}
.you-said img{max-height:90px;border-radius:8px;align-self:flex-end}
.q{font-weight:700}
.actions3{display:flex;gap:8px}
.actions3 .btn{flex:1;padding:12px 8px}
@media (prefers-reduced-motion: reduce){ .icon-btn.on{animation:none} }
.guide{display:flex;flex-direction:column;gap:10px}
.need{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.need li{background:var(--surface-2);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.need b{font-family:var(--display);font-size:15px}
.need span{font-size:12px;color:var(--muted)}
.examples{display:flex;flex-direction:column;gap:6px}
.examples button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:500}
.examples button:hover{border-color:var(--primary)}
.split{display:flex;flex-direction:column;gap:8px}
.split-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.split-head select{border:0;background:transparent;color:var(--muted);font-weight:600;text-align:right;padding:4px}
.split-list{list-style:none;margin:0;padding:0 14px;background:var(--surface-2);border-radius:14px}
.split-list li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.split-list li:first-child{border-top:0}
.tick{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--on-primary);display:grid;place-items:center;padding:0}
.tick[aria-pressed="true"]{background:var(--primary);border-color:var(--primary)}
.tick svg{width:16px;height:16px}
.who{font-weight:600;min-width:0;overflow-wrap:anywhere}
.who.off{color:var(--muted)}
.split-list b{font-variant-numeric:tabular-nums}
.amt-in{width:96px;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums}
.amt-in:disabled{opacity:.4}
/* check box on home */
.checkbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.checkbox .hero{border-radius:0}
.check-body{padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;height:clamp(360px,56vh,430px)}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-right:10px;overscroll-behavior:contain;scrollbar-width:thin}
.check-body .askbar{flex:none}
.modes button[aria-pressed="true"]{background:var(--on-primary);color:var(--primary)}
.sub{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
/* check */
.back{display:flex;align-items:center;gap:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button[aria-pressed="true"]{background:var(--lime);color:#0E0E0E;border-color:var(--lime)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);padding:4px;border-radius:12px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:700;font-size:14px;color:var(--muted)}

.btn.on{animation:pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.btn.on{animation:none}}

.deal{background:var(--good-bg);border-radius:14px;padding:12px 14px}

.walk{background:var(--bad-bg);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tiplist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.plan{display:flex;gap:8px;list-style:none;margin:0;padding:0}
.plan li{flex:1;background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.plan small{font-size:11px;font-weight:600;color:var(--muted)}
.plan b{font-family:var(--display);font-size:18px}

<script type="module">import { api } from "/src/api.ts"; import * as shared from "@fairfare/shared"; window.fairfareApi = api; window.fairfareShared = shared; // shared = the same bargain rules the API uses</script>
<script>
/* ---------- data (sample estimates for the demo; verify before launch) ---------- */
const RATES={GBP:21500,EUR:18500,USD:16300,IDR:1,AUD:10700,CAD:11800,AED:4400,SGD:12600,MYR:3800,INR:190,JPY:108,TRY:400,THB:480}; // IDR per 1 unit of that currency (approx.)
const SYM={GBP:'£',EUR:'€',USD:'$',IDR:'Rp',AUD:'A$',CAD:'C$',AED:'AED',SGD:'S$',MYR:'RM',INR:'₹',JPY:'¥',TRY:'₺',THB:'฿'};
const NODEC=['IDR','JPY']; // currencies shown without decimals
const COUNTRIES=[['AU','Australia','🇦🇺','AUD'],['CA','Canada','🇨🇦','CAD'],['FR','France','🇫🇷','EUR'],['DE','Germany','🇩🇪','EUR'],['IN','India','🇮🇳','INR'],
  ['ID','Indonesia','🇮🇩','IDR'],['IE','Ireland','🇮🇪','EUR'],['IT','Italy','🇮🇹','EUR'],['JP','Japan','🇯🇵','JPY'],['MY','Malaysia','🇲🇾','MYR'],
  ['NL','Netherlands','🇳🇱','EUR'],['SG','Singapore','🇸🇬','SGD'],['ES','Spain','🇪🇸','EUR'],['TR','Türkiye','🇹🇷','TRY'],
  ['AE','United Arab Emirates','🇦🇪','AED'],['GB','United Kingdom','🇬🇧','GBP'],['US','United States','🇺🇸','USD']]
  .map(([code,name,flag,cur])=>({code,name,flag,cur}));
// ok:false = shown with its flag and currency, but the demo only has prices for Bali
const DESTS=[
  {name:'Indonesia (Bali)',short:'Indonesia',flag:'🇮🇩',cur:'IDR',curName:'Indonesian rupiah',ok:true},
  {name:'Thailand (Bangkok), coming soon',short:'Thailand',flag:'🇹🇭',cur:'THB',curName:'Thai baht',ok:false},
  {name:'Malaysia (Kuala Lumpur), coming soon',short:'Malaysia',flag:'🇲🇾',cur:'MYR',curName:'Malaysian ringgit',ok:false}];
const STYLES={local:{label:'Cheap & local',mult:1,who:'Locals usually pay'},mid:{label:'Mid-range',mult:1.8,who:'Mid-range places usually charge'},fancy:{label:'Fancy',mult:3.5,who:'Fancy places usually charge'}};
const r5=x=>{const st=x>=100000?10000:x>=10000?5000:x>=1000?500:x>20?5:1;return Math.round(x/st)*st}; // round to a friendly number
function rng(p){const m=STYLES[S.check.style].mult;return[r5(p.min*m),r5(p.max*m)]}
// the one fixed category list (same as the API contract); never add another here
const CATS={
  transport:{label:'Transport',color:'var(--c1)'},
  food:{label:'Food & drink',color:'var(--c2)'},
  activities:{label:'Activities',color:'var(--c3)'},
  shopping:{label:'Shopping',color:'var(--c4)'},
  stay:{label:'Stay',color:'var(--c5)'},
  essentials:{label:'Essentials',color:'var(--c6)'},
  other:{label:'Other',color:'var(--c7)'}};
// anything old or unknown still shows: "sim" is essentials, the rest falls back to other
const catKey=k=>k==='sim'?'essentials':CATS[k]?k:'other';
const PRICES=[
  {id:'taxi-airport',cat:'transport',name:'Taxi: airport to Seminyak',min:150000,max:250000,tip:'Use Grab or Gojek, or agree the price before you get in. Ask for the meter: "argo".',b:'bargain'},
  {id:'taxi-city',cat:'transport',name:'Short ride by Grab or Gojek',min:20000,max:50000,tip:'The app shows the price before you go. Street taxis often quote double.',b:'fixed'},
  {id:'tea',cat:'food',name:'Iced tea at a warung',min:5000,max:15000,tip:'Beach and tourist areas charge more. One street back is cheaper.',b:'fixed'},
  {id:'nasi',cat:'food',name:'Nasi goreng at a warung',min:25000,max:50000,tip:'Check the menu has prices on it before you sit down.',b:'ask'},
  {id:'oj',cat:'food',name:'Fresh juice at a stall',min:15000,max:35000,tip:'Ask for no sugar syrup and no ice if you are unsure about the water.',b:'bargain'},
  {id:'water',cat:'food',name:'Water, 1.5L bottle',min:6000,max:12000,tip:'Minimarkets are cheapest. Beach kiosks often charge double.',b:'fixed'},
  {id:'sim',cat:'essentials',name:'Tourist SIM with data',min:100000,max:200000,tip:'Buy at an official Telkomsel or XL shop. Bring your passport.',b:'fixed'},
  {id:'sarong',cat:'shopping',name:'Batik sarong at a market',min:50000,max:150000,tip:'Start at about half the first price and meet in the middle.',b:'bargain'},
  {id:'massage',cat:'activities',name:'Balinese massage, 1 hour',min:100000,max:250000,tip:'Spas with a price list are fixed. For a street or beach massage, agree the price first and ask politely for a discount.',b:'ask'},
  {id:'carving',cat:'shopping',name:'Small wooden carving',min:100000,max:250000,tip:'Check the finish and ask where it was made. Shop prices are often fixed.',b:'ask'}];

/* ---------- state ---------- */
const S={
  step:1, open:null, errors:{},
  user:{name:'',email:'',age:'',country:'',home:'GBP'},
  trip:{dest:0,budget:'',touched:false,start:'2026-10-24',end:'2026-10-30',mode:'group',friends:[],newFriend:''}, // starts blank: no budget, no friends
  session:null, tripData:null, summary:null, expenses:[], extra:{}, join:null, loadErr:'', inviteEmail:'', // session + trip come from the API
  check:{style:'local',text:'',step:null,err:'',cat:'transport',input:'text',itemId:'taxi-airport',amount:250,result:null,paid:null,paidAmt:0,paidCat:'transport',paidBy:null,saving:false,bg:null,bgInput:'',split:{mode:'equal',on:{},custom:{}},listening:false,transcript:'',photo:null,photoRead:false}
};

const S0=JSON.stringify(S); // the starting state, kept so Reset can put everything back

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setPath(p,v){const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>o=o[x]);o[k[k.length-1]]=v}
const home=()=>S.user.home;
const symTxt=c=>SYM[c].length>2?SYM[c]+' ':SYM[c];
const fmtCur=(v,c)=>symTxt(c)+(NODEC.includes(c)?Math.round(v).toLocaleString('en-GB'):v.toFixed(2));
const fmtHome=v=>fmtCur(v,home());
const cty=()=>COUNTRIES.find(c=>c.code===S.user.country);
const dest=()=>DESTS[S.trip.dest];
const destAmt=()=>(Number(S.trip.budget)||0)*RATES[home()]/RATES[dest().cur];
const fmtNum=(v,c)=>(NODEC.includes(c)||v>=1000?Math.round(v):Math.round(v*100)/100).toLocaleString('en-GB');
// a rate line like "£1 = Rp21,500"; tiny rates show per 1,000 so they stay readable
function rateLine(){if(home()===dest().cur)return'Same currency, nothing to convert';let r=RATES[home()]/RATES[dest().cur],u=1;while(r<1&&u<1e6){u*=10;r*=10}
  return `${symTxt(home())}${u.toLocaleString('en-GB')} = ${symTxt(dest().cur)}${r>=100?Math.round(r).toLocaleString('en-GB'):r.toFixed(4)}`}
const niceRound=x=>{const p=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/p)*p};
// onboarding step 1: all four fields filled, 18 or over, real-looking email
const emailOk=e=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e.trim());
function ageMsg(){const a=S.user.age;if(a==='')return'';const n=Number(a);
  if(!Number.isInteger(n)||n>120)return'Enter your age in whole years.';
  return n<18?'You need to be 18 or over to use local-ish.':''}
const onb1Ok=()=>!!(S.user.name.trim()&&cty()&&S.user.age!==''&&!ageMsg()&&emailOk(S.user.email));
const onb3Ok=()=>dest().ok&&Number(S.trip.budget)>0;
// typing doesn't re-render (that would drop focus), so update the live bits in place
function syncOnb(){
  if(S.step===1){const a=$('#age-err'),m=ageMsg();if(a){a.textContent=m;a.hidden=!m}
    const e=$('#email-err');if(e)e.hidden=!S.user.email||emailOk(S.user.email);
    const n=$('#onb-next');if(n)n.disabled=!onb1Ok()}
  if(S.step===6){const b=$('#j-go');if(b)b.disabled=S.join.busy||!S.join.name.trim()}
  if(S.step===3){const bi=$('#f-budget');if(bi)bi.style.width=(bi.value.length+.5)+'ch'; // hugs the digits so the currency sign stays next to them
    const o=$('#fx-out');if(o)o.textContent=fmtNum(destAmt(),dest().cur);
    const fc=$('.fx-cards');if(fc)fc.classList.toggle('sm',fxSmall())
    const d=$('#fx-day');if(d)d.textContent='≈ '+fmtNum(destAmt()/days(),dest().cur)+' '+dest().cur+' a day'
    const e=$('#fx-each');if(e)e.textContent=eachTxt();
    const n=$('#onb-next');if(n)n.disabled=!onb3Ok()}}
// the home and destination amounts always share one size: both shrink when either gets long
const fxSmall=()=>Math.max(String(Number(S.trip.budget)||0).length,fmtNum(destAmt(),dest().cur).length)>9;
const budgetLabel=()=>isGroup()?'Total trip budget for your group':'Your trip budget';
const eachTxt=()=>`≈ ${symTxt(home())}${fmtNum(perPersonHome(),home())} each for ${members()} people`;
const loc=n=>'Rp'+Math.round(n).toLocaleString('en-GB');
const rangeTxt=(a,b)=>'Rp'+a.toLocaleString('en-GB')+'–'+b.toLocaleString('en-GB');
const kTxt=n=>n>=1000?Math.round(n/1000)+'k':String(n);
const both=n=>`${loc(n)} <span class="approx">≈ ${fmtHome(n/RATES[home()])}</span>`;
// Before the trip exists these come from the onboarding form; after that, from the trip the API holds (everyone sees the same).
const T=()=>S.tripData;
const myId=()=>S.session?S.session.personId:null;
const isGroup=()=>T()?T().people.length>1:S.trip.mode==='group'&&S.trip.friends.length>0;
const members=()=>T()?Math.max(1,T().people.length):(isGroup()?S.trip.friends.length+1:1);
const nameOf=id=>{const p=T()&&T().people.find(x=>x.id===id);return p?p.name:'Someone'};
// The budget box holds the WHOLE group's budget (or just yours when alone). Everything personal is that total split by head count.
const groupBudgetLoc=()=>(Number(S.trip.budget)||0)*RATES[home()];
const perPersonHome=()=>(Number(S.trip.budget)||0)/members();
const budgetLoc=()=>groupBudgetLoc()/members(); // my share of the budget, in rupiah
function days(){const a=new Date(S.trip.start),b=new Date(S.trip.end);const d=Math.round((b-a)/864e5)+1;return isFinite(d)&&d>0?d:1}
const daily=()=>budgetLoc()/days();
function dateRange(){try{const o={day:'numeric',month:'short'};const a=new Date(S.trip.start).toLocaleDateString('en-GB',o),b=new Date(S.trip.end).toLocaleDateString('en-GB',o);return a+' – '+b}catch(e){return''}}
const sum=a=>a.reduce((t,e)=>t+e.amt,0);
const myOf=e=>e.shares[myId()]||0;
const sharers=e=>Object.values(e.shares).filter(v=>v>0).length;
// everyone who has joined, ticked by default in the split; person ids are the keys, never names
const people=()=>T()?T().people.filter(p=>p.status==='joined').map(p=>({key:p.id,id:p.id,name:p.id===myId()?`${p.name} (Me)`:p.name})):[];
const mapExpense=e=>({id:e.id,item:e.item,cat:catKey(e.category),amt:e.amount,shares:e.shares,paidBy:e.paidBy});
// our built-in list first, then prices the API learned (researched items aren't in the built-in list)
const item=id=>PRICES.find(p=>p.id===id)||S.extra[id];
const learnItem=it=>{if(it&&!item(it.id))S.extra[it.id]={id:it.id,cat:catKey(it.category),name:it.name,min:it.min,max:it.max,tip:it.tip}};
const domainOf=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return u}};
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

const ICON={
  text:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>',
  voice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'};

/* ---------- onboarding ---------- */
const CHEV='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const TREND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>';
const DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>';
// one side of the converter: flag + name on the left (the invisible select opens on tap), amount on the right
const fxPick=(flag,name,bind,label,opts)=>`<label class="fx-pick"><span class="flag" aria-hidden="true">${flag}</span><b>${esc(name)}</b>${CHEV}

const SEND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
const EXAMPLES=['Taxi from the airport to Seminyak at night, he wants 400000','Iced tea at a fancy beach club, 60000','Batik sarong at the market, 300000'];
const STYLE_KEYS=[['fancy',/fancy|beach.?club|hotel|luxury|villa/],['mid',/mid|nice|sit.?down/]];
const KEYS=[['taxi-airport',/airport/],['taxi-city',/taxi|cab|ride|grab|gojek/],['tea',/tea|teh/],['oj',/juice/],['water',/water/],['nasi',/nasi|warung|dinner|lunch|meal|food|restaurant/],['massage',/massage|spa\b/],['sim',/sim|data|telkomsel/],['sarong',/sarong|batik|scarf|shirt/],['carving',/carving|mask|wood|souvenir/]];
function parseAsk(t){t=t.toLowerCase();const nums=t.match(/\d+(\.\d+)?/g);if(!nums)return null;
  const k=KEYS.find(([,re])=>re.test(t));if(!k)return null;const st=STYLE_KEYS.find(([,re])=>re.test(t));
  return{itemId:k[0],amount:Number(nums[nums.length-1]),style:st?st[0]:'local'}}

const PHOTO_ENABLED=false; // photo checks are paused: flip to true to bring the camera button back

      <button class="icon-btn ${c.listening&&micTarget==='check'?'on':''}" data-action="listen" aria-label="${c.listening&&micTarget==='check'?'Stop recording':'Say it'}" aria-pressed="${c.listening&&micTarget==='check'}" ${c.hearing||c.busy?'disabled':''}>${ICON.voice}</button>

      </ul>

function verdictOf(p,a){const[mn,mx]=rng(p);if(a<=mx)return a<mn?'great':'fair';if(a<=mx*1.3)return'high';return'tooHigh'}
// everything the verdict card needs. If the API answered, its range/verdict/target/plan win ("the database decides").
function calc(r){
  const c=S.check,p=item(r.itemId),a=r.amount,ap=r.api;
  const [mn,mx]=ap?[ap.range.min,ap.range.max]:rng(p);
  const v=ap?ap.verdict:verdictOf(p,a);
  const target=ap?ap.target:r5((mn+mx)/2);
  const clamp=x=>Math.min(mx,Math.max(mn,Number(x)||0));
  const pp=ap&&ap.plan||{}; // plan numbers must stay inside the usual range, whatever the AI says
  const plan={openWith:clamp(pp.openWith||mn),aimFor:clamp(pp.aimFor||target),walkAwayAbove:clamp(pp.walkAwayAbove||mx)};
  const ribu=Math.round(plan.openWith/1000);
  const tpl={local:`Wah, mahal banget! ${ribu} ribu saja, boleh?`,polite:`Maaf, bisa ${ribu} ribu saja, Pak?`,english:`Wow, that's very expensive! Just ${loc(plan.openWith)}, okay?`};
  const ph=ap&&ap.phrase&&/^id/.test(ap.phrase.lang||ap.phrase.localLang||'')?{local:ap.phrase.local||tpl.local,polite:ap.phrase.polite||tpl.polite,english:ap.phrase.english||tpl.english}:tpl;
  // how to handle this price here. The verdict is the same in every mode; only the action changes.
  const sh=window.fairfareShared,asItem=q=>({id:q.id,city:'bali',category:q.cat,name:q.name,min:q.min,max:q.max,currency:'IDR',tip:q.tip||'',bargain:q.b});
  const mode=ap&&ap.bargainMode||sh.resolveBargainMode({style:c.style,situation:r.said,itemDefault:p.b||sh.defaultBargain({category:p.cat})});
  const alt=ap?ap.alternative:mode==='fixed'?sh.cheaperAlternative(asItem(p),c.style,[...PRICES,...Object.values(S.extra)].map(asItem)):undefined;
  const tips=ap&&ap.tips&&ap.tips.length?ap.tips:sh.templateTips({category:p.cat},alt);
  const askPh=ap&&mode==='ask'&&ap.phrase?ap.phrase:sh.askPhrase();
  return{c,p,a,v,mn,mx,target,plan,ph,mode,tips,alt,askPh,advice:ap&&ap.advice||''}}

const payForm=()=>{const c=S.check;return `<div class="sub">
      <label class="field">How much did you pay?<div class="prefix"><span style="font-size:12px">IDR</span><input id="p-amt" type="text" inputmode="numeric" autocomplete="off" style="padding-left:52px" data-bind="check.paidAmt" value="${(Number(c.paidAmt)||0)?Math.round(Number(c.paidAmt)).toLocaleString('en-GB'):''}" placeholder="0"></div></label>
      <label class="field">Category<select id="p-cat" data-bind="check.paidCat">${Object.entries(CATS).map(([k,x])=>`<option value="${k}" ${k===c.paidCat?'selected':''}>${x.label}</option>`).join('')}</select></label>
      ${isGroup()?`<label class="field">Paid by<select id="p-by" data-bind="check.paidBy">${people().map(x=>`<option value="${x.id}" ${x.id===c.paidBy?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`:''}
      ${isGroup()?splitView():''}
      <button class="btn btn-primary btn-block" data-action="save" ${c.saving?'disabled':''}>${c.saving?'Saving…':'Save to budget'}</button></div>`};

function unknownView(){
  const c=S.check,r=c.result,a=r.amount;
  const next=c.step==='pay'?payForm():`<p class="q">What do you want to do?</p>
    <div class="actions3">
      <button class="btn btn-primary" data-action="choose" data-next="pay">Pay</button>
      <button class="btn btn-ghost" data-action="choose" data-next="leave">Leave it</button>
    </div>`;
  return `<p class="you-said">${esc(r.said)}</p>
  <div class="verdict v-fair" aria-live="polite">
    <p class="big">${both(a)}</p>
    <p>We don't have local prices for that yet.</p>
    <p class="hint" style="color:var(--fg)">You can still log it so your budget stays right.</p>
  </div>
  ${next}`}

function resultView(){
  const r=S.check.result;if(!item(r.itemId))return unknownView();
  const {c,p,a,v,mn,mx,target,plan,ph,mode,tips,alt,askPh,advice}=calc(r), who=STYLES[c.style].who;
  const label={great:'Great deal',fair:'Fair price',high:'A bit high',tooHigh:'Too high'}[v];
  const hi=Math.max(a,mx)*1.15, pos=x=>Math.min(100,Math.max(0,x/hi*100));
  const bargainable=(v==='high'||v==='tooHigh')&&mode==='bargain'; // plan chips and the Bargain button are for bargain places only
  const msg=advice||(mode==='bargain'?{great:`${who} ${rangeTxt(mn,mx)}. You're paying less.`,fair:`${who} ${rangeTxt(mn,mx)}. This is normal.`,
    high:'',tooHigh:''}[v]:window.fairfareShared.templateAdvice(mode,v)); // bargain + high: the Start / Aim / Walk away numbers say it
  const planHtml=bargainable?`<ul class="plan" aria-label="Bargaining plan"><li><small>Start</small><b>${kTxt(plan.openWith)}</b></li><li><small>Aim</small><b>${kTxt(plan.aimFor)}</b></li><li><small>Walk away</small><b>${kTxt(plan.walkAwayAbove)}+</b></li></ul>`:'';
  const indo=ph.local, polite=ph.polite;
  // where the price came from: our own list, or the web (with tappable sources: domain name only, new tab)
  const web=r.api&&r.api.source==='web',links=(r.fresh&&r.sources&&r.sources.length?r.sources:(r.api&&r.api.sources)||[]).slice(0,3);
  const srcHtml=`<p class="src">${mode==='fixed'?'<span class="status">Fixed-price place</span> ':''}${web?(r.fresh?'🌐 Researched just now':'🌐 Researched from the web'):'Local data'}${web&&links.length?' · '+links.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(domainOf(u))}</a>`).join(' · '):''}</p>`;
  const said=r.from==='photo'?`${c.photo?`<img src="${c.photo}" alt="">`:''}Photo: ${p.name}, ${loc(a)}`:esc(r.said);
  let next='';
  if(c.step==='choose'||c.step==='bargain') next=`
    ${c.step==='bargain'?`<div class="say">
      <p class="eyebrow">Say this</p>
      <p class="phrase">${indo}</p>
      <p class="muted">"${esc(ph.english)}"</p>
      <div class="row"><button class="btn btn-primary" data-action="speak" data-lang="id-ID" data-text="${esc(indo)}">${ICON.voice.replace('<svg','<svg width="18" height="18"')}Bahasa Indonesia</button>
        <button class="btn btn-ghost" data-action="speak" data-lang="id-ID" data-text="${esc(polite)}">Polite version</button></div>
      ${c.realVoice?'':`<p class="demo">Demo uses your device's voice. The real app uses ElevenLabs.</p>`}
      ${mode==='bargain'?bgView(mode):''}</div>`:''}
    ${c.step==='choose'&&mode==='ask'&&v!=='great'?`<div class="say">
      <p class="eyebrow">Ask politely</p>
      <p class="phrase">${esc(askPh.local)}</p>
      <p class="muted">"${esc(askPh.english)}"</p>
      <div class="row"><button class="btn btn-primary" data-action="speak" data-lang="id-ID" data-text="${esc(askPh.local)}">${ICON.voice.replace('<svg','<svg width="18" height="18"')}Bahasa Indonesia</button></div>
      ${bgView('ask')}</div>`:''}
    ${c.step==='choose'&&mode==='fixed'?`<div class="say">
      <p class="eyebrow">Good to know</p>
      <ul class="tiplist">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
      ${alt?`<p class="muted">Cheaper nearby: ${esc(alt.name)}, usually ${rangeTxt(alt.min,alt.max)}</p>`:''}</div>`:''}
    <p class="q">${c.step==='bargain'?'Did it work?':'What do you want to do?'}</p>
    <div class="actions3">
      ${c.step==='choose'&&bargainable?`<button class="btn btn-ghost" data-action="choose" data-next="bargain">Bargain</button>`:''}
      ${c.bg&&c.bg.done&&c.bg.done.type==='walk'?'':`<button class="btn btn-primary" data-action="choose" data-next="pay">Pay</button>`}
      <button class="btn btn-ghost" data-action="choose" data-next="leave">Leave it</button>
    </div>`;
  if(c.step==='pay') next=payForm();
  return `
  <p class="you-said">${said}</p>
  <div class="verdict v-${v}" aria-live="polite">
    <span class="pill">${label}</span>
    <p class="big">${both(a)}</p>
    ${srcHtml}
    ${msg?`<p>${msg}</p>`:''}
    <div class="range" aria-hidden="true">
      <span class="ok" style="left:${pos(mn)}%;width:${pos(mx)-pos(mn)}%"></span>
      <span class="you" style="left:${pos(a)}%"></span>
      <span class="lbl" style="left:${pos((mn+mx)/2)}%">usual ${kTxt(mn)}–${kTxt(mx)}</span>
    </div>
    ${planHtml}
  </div>
  ${next}`;
}

function pie(entries){
  const tot=entries.reduce((t,[,v])=>t+v,0);
  if(!tot) return `<p class="muted">Nothing spent yet. Check a price and tap "Yes, I paid" to add one.</p>`;
  let acc=0; const stops=entries.filter(([,v])=>v>0).map(([k,v])=>{const s=acc/tot*360;acc+=v;return `${CATS[k].color} ${s}deg ${acc/tot*360}deg`}).join(',');
  return `<div class="pie-wrap"><div class="pie" style="background:conic-gradient(${stops})" role="img" aria-label="Spending by category"></div>
    <ul class="legend">${entries.filter(([,v])=>v>0).map(([k,v])=>`<li><i style="background:${CATS[k].color}"></i><span>${CATS[k].label}</span><span class="cat-amt"><b class="num">${loc(v)}</b><small>${Math.round(v/tot*100)}%</small></span></li>`).join('')}</ul></div>`;
}
function budgetFrames(){

  const row=e=>{const n=sharers(e),by=e.paidBy===me?'you':esc(nameOf(e.paidBy));

  if(open==='group'){

    const byCat=Object.keys(CATS).map(k=>[k,sum(g.filter(e=>e.cat===k))]);
    // only the payments that involve me: "Bella owes you", "You owe Dewi", or all settled
    const mine=((sm&&sm.transfers)||[]).filter(t=>t.fromId===me||t.toId===me);
    const settle=mine.length?mine.map(t=>t.toId===me
      ?`<div class="owe"><span>${esc(t.fromName)} owes you</span><span class="num">${both(t.amount)}</span></div>`
      :`<div class="owe"><span>You owe ${esc(t.toName)}</span><span class="num">${both(t.amount)}</span></div>`).join('')
      :`<div class="owe"><span>You're all settled ✓</span></div>`;
    detail=`<section class="card">

  }

  catch(e){preview=null}}
async function finishRec(stream,chunks,type,target){
  const c=S.check;clearTimeout(recTimer);stopPreview();stream.getTracks().forEach(k=>k.stop());rec=null;
  c.listening=false;c.hearing=true;render();
  try{
    const text=chunks.length?(await window.fairfareApi.speechToText(new Blob(chunks,{type}))).trim():'';
    c.hearing=false;
    if(target==='seller'){c.hearing=false;return sellerSaid(text)} // hand-the-phone answer: straight into the chat
    if(!text){c.text='';return micFail('No clear speech was heard. Try again or type it.')}
    c.text=text;c.err='';render();const el=$('#c-ask');el&&el.focus()
  }catch(e){c.hearing=false;if(target==='seller')return bgNote("Didn't catch that, let them try again.");c.text='';micFail("Couldn't hear that. Try again or type it.")}}
// parse + check through the API (the database decides the numbers); if it is down, or has no Bali prices yet,
// the keyword parser and local prices below answer instead, so the screen never goes blank
// what the API stores for this trip: budgetHome is ONE person's share, groupBudgetHome the whole group's.
// The server makes the person ids; the creator is the person marked isMe.
function tripPayload(){
  const friends=isGroup()?S.trip.friends:[],total=Number(S.trip.budget)||0;
  return{city:'bali',currency:'IDR',homeCurrency:home(),rateToLocal:RATES[home()],...(S.inviteCode?{inviteCode:S.inviteCode}:{}), // the same code the link on step 2 already showed
    budgetHome:total/members(),groupBudgetHome:total,start:S.trip.start,end:S.trip.end,
    people:[{id:'me',name:S.user.name.trim()||'Me',isMe:true,status:'joined',...(emailOk(S.user.email)?{email:S.user.email.trim()}:{})}]
      .concat(friends.map((f,i)=>({id:'f'+i,name:f.name,isMe:false,status:'invited',...(emailOk(f.email||'')?{email:f.email}:{})})))}}

/* ---------- session, routing, shared data ---------- */
const SESSION_KEY='localish:session';
function readSession(){try{const v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');return v&&v.tripId&&v.personId?v:null}catch(e){return null}}
function saveSession(v){try{localStorage.setItem(SESSION_KEY,JSON.stringify(v))}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}}
const go=(path,replace)=>{try{history[replace?'replaceState':'pushState'](null,'',path)}catch(e){}};

// makes the trip, remembers who I am on this device, and opens it
async function startTrip(skipped){
  if(S.starting)return;
  S.errors={};S.starting=true;render();
  try{
    const t=await window.fairfareApi.createTrip(tripPayload());
    const me=t.people.find(p=>p.isMe)||t.people[0];
    S.session={tripId:t.id,personId:me.id,name:me.name};saveSession(S.session);
    S.tripData=t;S.summary=null;S.expenses=[];S.loadErr='';
    go('/trip/'+t.id);startPolling();
    S.starting=false;S.step=skipped?5:4;S.fresh=true;render(true);
    loadTrip({force:true})
  }catch(e){S.starting=false;S.errors.trip=e.message||"Couldn't start your trip. Try again.";if(S.step!==3)S.step=3;render()}}

let lastData='',pollT=0;
// trip + expenses + my summary. Re-draws only when something changed, and keeps the cursor where it was.
async function loadTrip(opts={}){
  const ses=S.session;if(!ses)return;
  try{
    const [trip,exps,sum]=await Promise.all([window.fairfareApi.getTrip(ses.tripId),window.fairfareApi.expenses(ses.tripId),window.fairfareApi.summary(ses.tripId,ses.personId)]);
    if(!trip.people.some(p=>p.id===ses.personId))throw new Error('Trip not found');
    if(S.session!==ses)return; // switched user while loading
    const snap=JSON.stringify([trip,exps,sum]);
    S.loadErr='';
    if(snap===lastData&&!opts.force)return;
    lastData=snap;S.tripData=trip;S.expenses=exps.map(mapExpense);S.summary=sum;
    S.user.name=ses.name;if(SYM[trip.homeCurrency])S.user.home=trip.homeCurrency;
    const on=S.check.split&&S.check.split.on;if(on)people().forEach(p=>{if(!(p.key in on))on[p.key]=true}) // someone who just joined is ticked in an open split
    if(opts.open){S.step=5;S.fresh=true;render(true)}
    else if(!S.check.listening&&!S.check.hearing&&!S.check.busy&&!S.check.saving)softRender()
  }catch(e){
    if(/not found/i.test(e.message)){ // e.g. the server was restarted and forgot this trip
      clearSession();S.session=null;S.tripData=null;stopPolling();go('/',true);S.step=1;S.errors={};
      S.loadErr="We couldn't find that trip any more. Start a new one, or ask your friend for a new invite link.";render(true)
    }else{S.loadErr=e.message||"Couldn't refresh your trip.";if(opts.open){S.step=5;render(true)}else softRender()}}}
function softRender(){
  const a=document.activeElement,id=a&&a.id,st=a&&a.selectionStart,en=a&&a.selectionEnd;
  render();
  if(id){const el=document.getElementById(id);if(el&&el!==document.activeElement){el.focus();try{el.setSelectionRange(st,en)}catch(e){}}}}
// refresh every 10s while the tab is visible; stop when hidden and catch up when it comes back
function startPolling(){stopPolling();if(!document.hidden)pollT=setInterval(()=>{if(S.session&&S.step===5)loadTrip()},10000)}
function stopPolling(){clearInterval(pollT);pollT=0}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPolling();else if(S.session){startPolling();if(S.step===5)loadTrip()}});
window.addEventListener('focus',()=>{if(S.session&&S.step===5)loadTrip()});

/* ---------- join screen: /join/<code> ---------- */
const INVITE_ERR="This invite link doesn't work. Ask your friend for a new one.";
const cap=x=>String(x).charAt(0).toUpperCase()+String(x).slice(1);
const fmtDay=(iso,year)=>{const d=new Date(iso+'T00:00:00');return isNaN(d)?iso:d.toLocaleDateString('en-GB',{day:'numeric',month:'short',...(year?{year:'numeric'}:{})})};
async function startJoin(code){
  S.step=6;S.join={code,info:null,name:'',err:'',busy:false,loading:true,bad:false};render(true);
  try{S.join.info=await window.fairfareApi.tripByCode(code)}
  catch(e){S.join.bad=true;S.join.err=/^Request failed/.test(e.message)?INVITE_ERR:e.message}
  S.join.loading=false;render()}
function joinView(){
  const j=S.join,top=`<div class="onb-top"><span class="brand"><i>local</i>-ish</span><span class="eyebrow">You're invited</span></div>`;
  if(j.loading)return `${top}<p class="muted">Opening your invite…</p>`;
  if(j.bad)return `${top}<div><h1>Invite link</h1></div><p class="err">${esc(j.err)}</p><button class="btn btn-ghost btn-block" data-action="toStart">Start my own trip</button>`;
  const i=j.info,cur=SYM[i.homeCurrency]?i.homeCurrency:'GBP';
  return `${top}
    <div><h1>Join ${esc(i.ownerName)}'s trip to ${esc(cap(i.city))}</h1><p class="muted" style="margin-top:6px">${fmtDay(i.start)} to ${fmtDay(i.end,true)}</p></div>
    <div class="stack"><h3>Who's already in</h3><div class="chips wrap">${i.people.map(n=>`<span class="chip">${esc(n)}</span>`).join('')}</div></div>
    <div class="chip-auto"><span class="cur-badge" aria-hidden="true">${SYM[cur]}</span><span>Your budget share ≈ <b>${symTxt(cur)}${fmtNum(i.perPersonBudgetHome,cur)}</b></span></div>
    <label class="field">Your name<input id="j-name" data-bind="join.name" value="${esc(j.name)}" autocomplete="given-name" placeholder="Your first name"></label>
    ${j.err?`<p class="err">${esc(j.err)}</p>`:''}
    <button class="btn btn-primary btn-block" id="j-go" data-action="join" ${j.busy||!j.name.trim()?'disabled':''}>${j.busy?'Joining…':'Join trip'}</button>`}
Object.assign(A,{
  // join by code; if the name matches someone the creator invited, you become that person
  async join(){
    const j=S.join;if(!j||j.busy||!j.name.trim())return;
    j.busy=true;j.err='';render();
    try{
      const t=await window.fairfareApi.joinTrip(j.code,j.name.trim());
      const me=t.people.find(p=>p.id===t.personId);if(!me)throw new Error("Couldn't join that trip. Try again.");
      S.session={tripId:t.id,personId:me.id,name:me.name};saveSession(S.session);
      S.join=null;S.tripData=t;S.summary=null;S.expenses=[];lastData='';
      go('/trip/'+t.id);startPolling();
      S.step=5;S.fresh=true;render(true);loadTrip({force:true})
    }catch(e){j.busy=false;j.err=e.message||"Couldn't join that trip. Try again.";render()}},
  toStart(){S.join=null;S.step=1;go('/',true);render(true)},
});

async function sendText(t,from,said){const c=S.check;
  if(c.busy)return;
  if(!t){c.err='Type what it is and the price first.';return render()}
  c.err='';c.busy=true;c.busyMsg='';render();
  // a brand-new item can take a few seconds while the API researches local prices
  const slow=setTimeout(()=>{if(c.busy){c.busyMsg='Researching local prices…';render()}},2500);
  let r=null,api=null,parsed=false,pr=null;
  try{
    pr=await window.fairfareApi.parse({city:'bali',text:t});
    parsed=true;
    if(pr.currency==='IDR'&&pr.confidence>=.5&&pr.itemId){
      try{const ck=await window.fairfareApi.check({tripId:S.session?S.session.tripId:'demo',itemId:pr.itemId,amount:pr.amount,style:pr.style,...(pr.situation?{situation:pr.situation}:{}),...(pr.bargainMode?{bargainMode:pr.bargainMode}:{})});
        if(ck.currency==='IDR'){api=ck;learnItem(ck.item)}}catch(e){}
      if(api||item(pr.itemId))r={itemId:pr.itemId,amount:pr.amount,style:pr.style};
    }
  }catch(e){parsed=false}
  clearTimeout(slow);c.busy=false;c.busyMsg='';
  if(!parsed)r=parseAsk(t);
  if(r){c.style=r.style;return A.check(r.itemId,r.amount,from,said(t),{api,fresh:!!(pr&&pr.researched),sources:pr&&pr.sources})}
  // the API understood it but has no (researched) price: show "no local prices yet", Pay still works
  if(parsed&&pr&&pr.amount>0)return A.check(null,pr.amount,from,said(t),{name:pr.item||t});
  const nums=t.match(/\d+(\.\d+)?/g);
  if(nums)return A.check(null,Number(nums[nums.length-1]),from,said(t),{name:t});
  c.err='Add what it is and the price, like "iced tea at the beach, 30000".';render()}
function readPhoto(dataUrl){S.check.photo=dataUrl;S.check.style='local';A.check('sarong',300000,'photo','')}

/* light / dark button: starts from the phone's setting, then remembers the choice */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>';
function setTheme(t,save){document.documentElement.dataset.theme=t;const b=$('#theme');
  b.innerHTML=t==='dark'?SUN:MOON;b.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');
  if(save)try{localStorage.setItem('theme',t)}catch(e){}}
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
$('#theme').addEventListener('click',()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark',true));
document.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(t&&A[t.dataset.action]){e.preventDefault();A[t.dataset.action](t)}});
// amount boxes: digits only, a comma every 3 digits as you type (99985 -> 99,985); the stored value stays a plain number
function moneyInput(t){
  const before=t.value.slice(0,t.selectionStart??t.value.length).replace(/\D/g,'').length;
  const n=Number(t.value.replace(/\D/g,''))||0, txt=n?n.toLocaleString('en-GB'):'';
  t.value=txt;let pos=0,seen=0;while(pos<txt.length&&seen<before){if(/\d/.test(txt[pos]))seen++;pos++}
  try{t.setSelectionRange(pos,pos)}catch(e){}
  return n}
document.addEventListener('input',e=>{const t=e.target;if(!t.dataset.bind)return;
  let v=t.value;if(t.id==='p-amt')v=moneyInput(t); if(t.dataset.bind==='trip.dest') v=Number(v);
  setPath(t.dataset.bind,v);
  if(t.id==='c-ask')syncSend();
  if(t.id==='bg-in')syncBgSend();
  if(t.dataset.bind==='user.country'){S.user.home=cty().cur} // flag + currency follow the country
  if(t.id==='f-budget')S.trip.touched=true;
  if(t.tagName==='SELECT'){ if(t.dataset.bind==='check.itemId') S.check.result=null; render() }
  else if(t.classList.contains('amt-in')){const sp=S.check.split,ps=people(),tot=ps.reduce((x,p)=>x+(sp.on[p.key]?Number(sp.custom[p.key])||0:0),0);const h=$('#s-left');if(h)h.textContent=splitLeft(Number(S.check.paidAmt)||0,tot)}
  else if(t.id==='c-amt'){const h=$('#c-amt-home');if(h)h.textContent='≈ '+fmtHome((Number(v)||0)/RATES[home()])}
  else syncOnb()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='f-friend'){e.preventDefault();A.addFriend()}if(e.key==='Enter'&&e.target.id==='c-ask'){e.preventDefault();A.send()}if(e.key==='Enter'&&e.target.id==='bg-in'){e.preventDefault();A.bgSend()}});
document.addEventListener('change',e=>{if(e.target.id==='p-amt')render();if(e.target.id==='photoIn'&&e.target.files[0]){const r=new FileReader();r.onload=()=>readPhoto(r.result);r.readAsDataURL(e.target.files[0])}});
// open the right screen for the address: an invite, a saved trip, or the start of onboarding
(function boot(){
  const join=location.pathname.match(/^\/join\/([^/]+)/);
  S.session=readSession();
  if(join)return startJoin(decodeURIComponent(join[1]));
  if(S.session){go('/trip/'+S.session.tripId,true);S.user.name=S.session.name;S.step=5;render(true);startPolling();return loadTrip({force:true})}
  if(/^\/trip\//.test(location.pathname))go('/',true); // a trip link without an invite: nothing to open on this device
  render();
})();
</script>
